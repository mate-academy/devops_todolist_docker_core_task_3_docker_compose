version: '3.8'

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: todolist
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - todolist_network

  app:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql://root:rootpassword@db/todolist
    ports:
      - "8080:8080"
    networks:
      - todolist_network
    volumes:
      - .:/app

volumes:
  mysql_data:

networks:
  todolist_network:
    driver: bridge
