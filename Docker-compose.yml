version: '3.8'
networks:
  db-data-net:
    driver: bridge
services:
  pythonapp:
    image: todoapp:3.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pythonapp
    ports:
      - "8081:8080"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - db-data-net
    depends_on:
      - mysql
    restart: unless-stopped
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - db-data-net
volumes:
  db-data:
    driver: local