services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysql -h 127.0.0.1 -uapp_user -p1234 app_db -e 'SELECT 1;'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  mysql_data:


