networks: 
  db-data-net:
    driver: bridge

services:
  pythonapp:
    build:
     context: .
     dockerfile: Dockerfile
    ports:
     - "8000:8000"
    environment:
     - APP_ENV=Development
    networks:
      - db-data-net
    depends_on:
      - mysql   
    restart: unless-stopped
 
  mysql:
    image: mysql:8.0
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - db-data-net

volumes:
  db-data: