version: '3.9'

networks:
  db-data-net:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-local
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app_user", "-p1234" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - db-data-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todoapp
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    ports:
      - "8080:8080"
    networks:
      - db-data-net
    depends_on:
      mysql:
        condition: service_started
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8080"

volumes:
  mysql-data: