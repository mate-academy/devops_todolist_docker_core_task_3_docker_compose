networks:
  todo-net:
    driver: bridge

services:
  pythonapp:
    image: todolist:1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000" 
    environment:
      - DEBUG=1
    networks:
      - todo-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: to_mysql:1.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - todo-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app_user", "-p1234"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db-data: