networks:
  db-data-net:
    driver: bridge
services:
  mysql:
   image: mysql:latest
   build:
     context: .
     dockerfile: Dockerfile.mysql
   container_name: my-sql 
   ports:
     - "3306:3306"
   volumes:
     - db-data:/var/lib/mysql
   environment:
     - MYSQL_ROOT_PASSWORD=1234
     - MYSQL_DATABASE=app_db
     - MYSQL_USER=app_user
     - MYSQL_PASSWORD=1234
   networks:
     - db-data-net
  pythonapp:
   image: gheifr/todoapp:2.0.0
   build:
     context: .
     dockerfile: Dockerfile
   ports:
     - "8080:8000"
   environment:
     - MYSQL_ROOT_PASSWORD=1234
     - MYSQL_PASSWORD=1234
     - MYSQL_HOST=mysql
     - MYSQL_DATABASE=app_db
     - MYSQL_USER=app_user
   networks:
     - db-data-net
   depends_on:
     - mysql
   restart: unless-stopped
volumes:
  db-data: