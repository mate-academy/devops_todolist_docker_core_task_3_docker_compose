services:

  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
  app:
    build: .
    ports:
      - "8000:8080"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql-data: