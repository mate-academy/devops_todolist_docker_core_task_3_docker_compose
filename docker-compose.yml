version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: todolist_db
    restart: always
    environment:
      MYSQL_DATABASE: todolist
      MYSQL_USER: todouser
      MYSQL_PASSWORD: todopassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: todolist_app
    restart: always
    command: sh -c "./entrypoint.sh"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: todolist
      DB_USER: todouser
      DB_PASSWORD: todopassword
      DB_HOST: db
      DB_PORT: 3306

volumes:
  mysql_data: