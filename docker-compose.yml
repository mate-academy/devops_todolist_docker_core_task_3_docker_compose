networks:
  db-data-net:
    driver: bridge

services:
  mysql:
    image: my-sql:1.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    ports:
      - "3306:3306"
    volumes:
      - "/var/lib/mysql"
    networks:
      - db-data-net
  todolist:
    image: app:1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=Development
    networks:
        - db-data-net
    depends_on:
        - mysql
    restart: unless-stopped
