version: '3.8'

services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    image: mysql:latest
    container_name: my-sql
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: '1234'
      MYSQL_DATABASE: 'app_db'
      MYSQL_USER: 'app_user'
      MYSQL_PASSWORD: '1234'
    networks:
      - db-data-net
    restart: unless-stopped

  pythonapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: app:latest
    ports:
      - '8080:8080'
    environment:
      APP_ENV: 'Development'
    networks:
      - db-data-net
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  db-data:

networks:
  db-data-net:
    driver: bridge
