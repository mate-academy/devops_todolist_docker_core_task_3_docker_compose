version: '3.8'

networks:
  db-data-net:
    driver: bridge

services:
  pythonapp:
    image: app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENV=local
      - DB_HOST=mysql
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=1234
      - DB_PORT=3306
    depends_on:
      - mysql
    networks:
      - db-data-net
    restart: unless-stopped
  mysql:
    image: mysql:latest
    build: 
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - db-data-net
    restart: unless-stopped
volumes:
  db_data:
    driver: local