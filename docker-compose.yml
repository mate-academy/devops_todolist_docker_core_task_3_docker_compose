version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: app-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    volumes:
    - db-data:/var/lib/mysql
    - ./mysql-init/:/docker-entrypoint-initdb.d/
    ports:
      - "3306:3306"
  web:
    build: .
    container_name: app-web
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: 1234
      DB_PORT: 3306
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    entrypoint: >-
      sh -c "
      until nc -z db 3306; do echo 'waiting for db...'; sleep 1; done;
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "
volumes:
  db-data: