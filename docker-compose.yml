version: "3"
networks:
  db-data-net:
    driver: bridge
services:
  todolistapp:
    image: app:1.0
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - db-data-net
    ports:
      - "8080:8080"
    depends_on:
      - mySQL
    restart: unless-stopped
  mySQL:
    image: mysql:latest
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mySQL
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: "1234"
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - db-data-net
volumes:
  db-data: