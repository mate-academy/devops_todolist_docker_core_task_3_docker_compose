version: '3.8'

services:
  mysql:
    image: mysql:8.4
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    ports: 
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - db-data-net


  pythonapp:
    image: app:1.2
    build:
      context: .
      dockerfile: Dockerfile
    ports: 
      - "8080:8080"
    environment:
      - APP_ENV=Development
    networks:
      - db-data-net
      
    depends_on:
      - mysql
    restart: unless-stopped

networks:
  db-data-net:
    driver: bridge

volumes:
  db-data:
    name: app-db-volume
