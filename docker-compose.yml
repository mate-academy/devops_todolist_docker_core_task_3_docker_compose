version: '3.0'
networks:
  db-data-net:
    driver: bridge
services:
  mysql: 
    image: mysql:1.0  
    build: 
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports: 
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - db-data-net
  todolist_app:
    image: todolist:1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist
    networks:
      - db-data-net
    ports: 
      - "8081:8080"
    depends_on:
      - mysql
    restart: unless-stopped
volumes:
  db-data: