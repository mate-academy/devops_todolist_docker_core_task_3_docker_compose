version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: todolist-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist-web
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  mysql_data:
