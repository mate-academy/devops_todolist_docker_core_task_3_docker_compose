services:

  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  app:
    build: .
    ports:
      - "8000:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: