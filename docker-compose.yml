version: '3'

networks:
  db-data-net:
    driver: bridge

services:
  todoapp:
    image: olzhu95/todoapp:3.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-web-app
    environment:
      - DB_HOST=mysql-db
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - db-data-net
  mysql:
    image: olzhu95/mysql-local:2.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql-db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - db-data-net
volumes:
  db-data:
