networks:
  mate_bridge:
    driver: bridge
volumes:
  mysql_mate_compose:

services:
  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mysql_mate
    container_name: django_app
    restart: unless-stopped
    networks:
      - mate_bridge

  mysql_mate:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - mate_bridge
    container_name: mysql_mate
    volumes:
      - mysql_mate_compose:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234