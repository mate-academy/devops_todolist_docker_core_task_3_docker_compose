version: '2.1'
networks:
  app-db-network:
    driver: bridge
services:
  app:
    image: app:1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-db-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=1234
      - DB_HOST=mysql
      - DB_PORT=3306
  mysql:
    image: mysql:8.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - app-db-network
    volumes:
      - db-data:/var/lib/mysql
volumes:
  db-data: