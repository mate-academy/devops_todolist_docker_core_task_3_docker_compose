version: "2.4"
networks:
  db-data-net:
    driver: bridge
services:
  mysql:
    image: mysql:8
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      db-data-net:

  pythonapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pythonapp
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      db-data-net:
volumes:
  db-data: {}




