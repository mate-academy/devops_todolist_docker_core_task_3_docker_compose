
services:
  db:
    image: mysql:latest
    container_name: todolist_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todolist_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist_app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: 1234
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todolist_network

volumes:
  mysql_data:
    driver: local

networks:
  todolist_network:
    driver: bridge

