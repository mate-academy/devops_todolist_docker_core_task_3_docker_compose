version: '3'

networks:
  db-data-net:
    driver: bridge
services:
  mysql:
    image: my-sql:2.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - db-data-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  todoapp:
    image: todoapp:2.1.0
    build: .
    container_name: todoapp
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy # wait MySQL to be healthy
    restart: unless-stopped
    networks:
      - db-data-net
volumes:
  db-data:
