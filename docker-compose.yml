# docker-compose.yml
version: '3'

services:
  mysql: 
    image: mysql:1.0.1
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
  web:
    image: app:2.0.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=Development
    depends_on:
      - mysql
    restart: unless-stopped
volumes:
  db-data: