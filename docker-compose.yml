version: "3.8"

networks:
  app-network:
    driver: bridge

services:
  mysql:
    image: mysql-local:2.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  app:
    image: todoapp:3.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist_app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql_data:
