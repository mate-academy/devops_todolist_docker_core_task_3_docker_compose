version: "3.8"
networks:
  todoapp-net:
services:
  mysql:
    image: my-mysql:latest
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql-container
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - todoapp-net

  todoapp:
    image: todoapp:latest
    build:
      context: .
    container_name: todoapp-container
    ports:
      - "8000:8080"
    environment:
      - APP_ENV=Development
    networks:
      todoapp-net:
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  db-data:
