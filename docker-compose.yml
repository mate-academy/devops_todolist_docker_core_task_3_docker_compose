version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_server
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: