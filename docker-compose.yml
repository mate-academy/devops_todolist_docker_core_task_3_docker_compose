services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    image: mysql-local:1.0.0
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: "1234"
      MYSQL_ROOT_PASSWORD: "root1234"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: todoapp:2.0.0
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: "1234"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
