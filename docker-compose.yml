version: "3.8"

networks:
    db-data-net:
        driver: bridge

services:
    pythonapp:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "8081:8080"
      environment:
        - ENV=local
        - DB_NAME=app_db
        - DB_USER=app_user
        - DB_PASSWORD=1234
        - DB_HOST=mysql
      networks:
        - db-data-net
      depends_on:
        mysql:
          condition: service_healthy
      restart: unless-stopped

    mysql:
        image: mysql:8.0
        container_name: mysql
        ports:
          - "3306:3306"
        volumes:
          - db-data:/var/lib/mysql
        environment:
          - MYSQL_ROOT_PASSWORD=1234
          - MYSQL_DATABASE=app_db
          - MYSQL_USER=app_user
          - MYSQL_PASSWORD=1234
        networks:
          - db-data-net
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
          interval: 3s
          timeout: 3s
          retries: 10
volumes:
    db-data: