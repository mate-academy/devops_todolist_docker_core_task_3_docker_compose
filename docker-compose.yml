version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - db-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-app
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - db-net
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  db_data:

networks:
  db-net:
