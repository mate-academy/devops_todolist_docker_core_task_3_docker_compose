networks:
  app-network:
    driver: bridge
services:
  python-app:
    image: app:1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-app
    ports:
      - 8080:8080
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - mysql
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - app-network
    restart: unless-stopped
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  db_data:
    driver: local
