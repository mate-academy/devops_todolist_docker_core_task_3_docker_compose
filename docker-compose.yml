version: '3.8'
networks:
  todolist-net:
    driver: bridge
volumes:
  todolist-data:
services:
  pythonapp:
    image: app:1.2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_app
    ports:
      - "8080:80"
    environment:
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=1234
      - DB_HOST=mysql
    networks:
      - todolist-net
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:latest
    container_name: mysql 
    ports:
      - "3306:3306"
    volumes: 
      - todolist-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - todolist-net