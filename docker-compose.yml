version: "3.8"
networks:
  todoapp-net:
services:
  mysql:
    image: my-mysql:latest
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql-container
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - todoapp-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "mysql-container", "-p1234" ]
      interval: 5s
      retries: 10
      start_period: 10s

  todoapp:
    image: todoapp:latest
    build:
      context: .
    container_name: todoapp-container
    ports:
      - "8000:8080"
    environment:
      - APP_ENV=Development
      - DB_HOST=mysql-container
      - DB_NAME=app_db
      - DB_USER=app_user
      - DB_PASSWORD=1234
      - DB_PORT=3306
    networks:
      todoapp-net:
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
