version: '3'
networks:
  db-data-net:
    driver: bridge
services:
  python-app:
    image: todoapp:3.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_container
    ports:
      - "8080:8080"
    networks:
      - db-data-net
    environment:
      - DB_HOST=mysql
    depends_on:
      - mysql
    restart: unless-stopped
  mysql:
    image: mysql-local:2.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql_container
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - db-data-net
volumes:
  db-data: