version: '3.8'

networks:
  todolist-net:
    driver: bridge

volumes:
  db-todolist:

services:
  mysql:
    image: my-sql:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - db-todolist:/var/lib/mysql
    networks:
      - todolist-net

  pythonapp:
    image: app:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - todolist-net
    restart: unless-stopped
    