version: '3'
networks:
  todo-network:
    driver: bridge

services:
  mysql-todo:
    image: mysql-local:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql-todo

    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: "1234"
      MYSQL_ROOT_PASSWORD: "1234"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - todo-network

  todoapp:
    image: todoapp:2.0.0
    build:
       context: .
       dockerfile: Dockerfile
    container_name: todoapp

    environment:
      DB_HOST: mysql-todo
      DB_PORT: "3306"

    ports:
      - "8080:8080"

    depends_on:
      - mysql-todo

    networks:
      - todo-network
volumes:
  mysql_data:
